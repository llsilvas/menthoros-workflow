name: ci

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate plugin manifests
        run: python3 tests/validate-manifests.py

      - name: Run hook test suite
        run: bash tests/run.sh
